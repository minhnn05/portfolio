networks:
  portfolio-net:
    driver: bridge

services:
  # ── Backend ─────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: portfolio-backend
    env_file: ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app          # hot-reload: thay đổi code → uvicorn tự restart
    restart: unless-stopped
    networks:
      - portfolio-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Frontend production (nginx + static build) ────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000/api
    container_name: portfolio-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - portfolio-net

  # ── Frontend dev (Vite dev server với hot-reload) ─────────────────────────
  # Dùng: docker compose --profile dev up
  frontend-dev:
    image: node:20-alpine
    container_name: portfolio-frontend-dev
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules          # anonymous volume để tránh override node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api
    depends_on:
      - backend
    networks:
      - portfolio-net
    profiles:
      - dev                        # chỉ chạy khi gọi --profile dev
